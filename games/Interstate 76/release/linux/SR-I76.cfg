# Interstate '76 (SR-I76) settings. Environment variables I76_<KEY> override these.

# renderer: glide (hardware 3D) or software
renderer = glide
# Windows: graphics API: d3d11 (default) or opengl (OpenGL 3.3 is always used on Linux)
graphics_api = d3d11
# Glide internal resolution = 640x480 * glide_scale (1-8)
glide_scale = 2
# initial window size = game resolution * window_scale
window_scale = 2
# start in full screen (Alt+Enter toggles)
fullscreen = 0
# frame rate limit: the game logic was made for ~20 FPS (physics, AI and weapons misbehave at high
# frame rates); 0 = unlimited
fps = 20
# Linux video driver: x11 (default, also on Wayland desktops via XWayland), wayland or auto
video_driver = x11
# vertical sync (1 = on, 0 = off)
vsync = 1
# sound (1 = on, 0 = off)
sound = 1
# CD drive: 2 = audio CD (music from music/*.mp3), 1 = game CD, 0 = no CD drive
cd = 2
# joystick / gamepad (1 = on, 0 = off)
joystick = 1
# joystick backend: sdl, or evdev (Linux: read /dev/input directly)
joystick_backend = sdl
