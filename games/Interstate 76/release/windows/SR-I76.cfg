# Interstate '76 (SR-I76) settings. Environment variables I76_<KEY> override these.

# renderer: glide (hardware 3D) or software
renderer = glide
# Windows: graphics API: d3d11 (default) or opengl (OpenGL 3.3 is always used on Linux)
graphics_api = d3d11
# widescreen 3D view (Hor+: the cockpit and world get wider, menus stay 4:3): auto = the desktop's aspect
# ratio, off = 4:3, or a ratio like 16:9, 16:10, 21:9
widescreen = auto
# 3D render resolution: auto = the window's height, or 1-8 = 640x480 * glide_scale
glide_scale = auto
# anti-aliasing (MSAA samples): 0 = off, 2, 4, 8
antialiasing = 4
# anisotropic texture filtering (1 = off, 2-16 = filter quality); sharpens textures seen at a
# grazing angle (roads, walls)
anisotropy = 8
# post-processing of the 3D picture: gamma (brightness, 0.5-2.5, 1.0 = unchanged), sharpen (0.0-1.0),
# fxaa (1 = FXAA edge smoothing, also usable with antialiasing = 0)
gamma = 1.0
sharpen = 0.0
fxaa = 0
# texture memory of the emulated 3Dfx card in MB (2-512); the original had 2 (more texture reloads)
texture_memory = 64
# texture pack: directory with replacement images <w>x<h>_<hash>.png; texture_dump = 1 writes the
# game's textures to textures_dump/ (names = replacement file names)
texture_pack = textures
texture_dump = 0
# initial window size = game resolution * window_scale
window_scale = 2
# start in full screen (Alt+Enter toggles)
fullscreen = 0
# frame rate limit: the game logic was made for ~20 FPS (physics, AI and weapons misbehave at high
# frame rates); 0 = unlimited
fps = 20
# Linux video driver: x11 (default, also on Wayland desktops via XWayland), wayland or auto
video_driver = x11
# vertical sync (1 = on, 0 = off)
vsync = 1
# sound (1 = on, 0 = off)
sound = 1
# CD drive: 2 = audio CD (music from music/*.mp3), 1 = game CD, 0 = no CD drive
cd = 2
# joystick / gamepad (1 = on, 0 = off)
joystick = 1
# joystick backend: sdl, or evdev (Linux: read /dev/input directly)
joystick_backend = sdl
